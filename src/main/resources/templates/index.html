<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            CINEHUB
        </div>

        <nav>
            <a href="#filmes">Filmes</a>
            <a href="#sessoes">Sessões</a>
            <a href="#cinema">O Cinema</a>
        </nav>

        <button class="login-button">
            Entrar
        </button>

    </header>


    <section class="hero">

        <div class="hero-content">

            <p class="small-title">
                EM EXIBIÇÃO
            </p>

            <h1 th:text="${movie.name}">
                AVATAR
            </h1>

            <p class="description">
                Uma experiência cinematográfica num mundo extraordinário
            </p>

            <div class="movie-info">

                <span th:text="${movie.releaseDate}">
                    2009
                </span>

                <span th:text="${movie.duration + ' min'}">
                    162 min
                </span>

                <span th:each="genre : ${movie.genres}"
                      th:text="${genre.name}">
                </span>

            </div>

            <button class="primary-button">
                Ver sessões
            </button>

        </div>

    </section>


    <section id="filmes" class="section">

        <div class="section-header">

            <div>

                <p class="section-label">
                    NO CINEMA
                </p>

                <h2>
                    Agora em exibição
                </h2>

            </div>

            <a href="#">
                Ver todos
            </a>

        </div>


        <div class="movies">

            <div class="movie-card"
                 th:each="movie : ${movies}">

                <div class="poster"
                     th:text="${movie.name}">
                    AVATAR
                </div>

                <div class="movie-card-info">

                    <h3 th:text="${movie.name}">
                        Avatar
                    </h3>

                    <p>

                        <span th:each="genre : ${movie.genres}"
                              th:text="${genre.name + ' '}">
                        </span>

                    </p>

                    <p th:text="${'Avaliação: ' + movie.rate}">
                        Avaliação: 7.8
                    </p>

                    <button class="secondary-button">
                        Ver sessões
                    </button>

                </div>

            </div>

        </div>

    </section>


    <section id="sessoes" class="sessions-section">

        <div class="section-header">

            <div>

                <p class="section-label">
                    PROGRAMAÇÃO
                </p>

                <h2>
                    Sessões
                </h2>

            </div>

        </div>


        <div th:each="entry : ${sessionsByMovie}"
             class="session">

            <div>

                <h3 th:text="${entry.key.name}">
                    Avatar
                </h3>

            </div>


            <div class="session-times">

                <div th:each="currentSession : ${entry.value}">

                    <p>

                        <span th:text="${currentSession.date}">
                            2026-10-10
                        </span>

                        <span th:text="${currentSession.room.name}">
                            Sala 1
                        </span>

                    </p>


                    <form th:action="@{/session}"
                          method="get">

                        <button type="submit"
                                name="id"
                                th:text="${currentSession.time}"
                                th:value="${currentSession.id}">
                            21:00
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </section>


    <footer>

        <div class="logo">
            CINEHUB
        </div>

        <p>
            Uma experiência cinematográfica
        </p>

    </footer>

</body>
</html>
