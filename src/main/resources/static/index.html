<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class = "navbar">
        <!--Assim posso tratar o logo como uma unidade-->
            <div class = "logo">
                CINEHUB   
            </div>
         <!--Os links permitem saltar para a respetiva secção-->
        <nav>
           <a href="#filmes">Filmes</a> 
           <a href="#sessoes">Sessões</a>
           <a href="#cinema">O Cinema</a>
        </nav>
         <button class="login-button">
             Entrar
         </button>
        
        
    </header>
    <section class="hero">
        
        <div class="hero-content">
            <p class="small-title">EM EXIBIÇÃO</p> 
            <h1>AVATAR</h1>
            <p class="description">Uma experiência cinematográfica num mundo extraordinário</p>
        
        <div class="movie-info">
            <!--Usa-se span para a informação estar na mesma linha, em vez de cada um estar numa linha diferente-->
            <span>2009</span>
            <span>162 min</span>
            <span>Ficção Científica</span>
        </div>
            <button class="primary-button">Ver sessões</button>
        </div>
    </section>
    <section id="filmes" class="section">
        
        <div class="section-header">
            
            <div>
                <p class="section-label">NO CINEMA</p>
                <h2>Agora em exibição</h2>
            </div>
            
            <a href="#verTodos">Ver todos</a>
            
        </div>
        
        <div class="movies">
            
            <div class="movie-card">
                
                <div class="poster">AVATAR</div>
                
                <div class="movie-card-info">
                    <h3>Avatar</h3>
                    <p>Ficção Científica</p>
                    <button class="secondary-button">Ver sessões</button>
                </div>
                
            </div>
             <div class="movie-card"></div>
              <div class="movie-card"></div>
            
        </div>
    </section>

</body>
</html>
